name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 04:17 UTC: catches newly published vulnerabilities without code changes
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript, actions
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  trivy:
    name: Trivy (dependencies, secrets, misconfiguration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan (SARIF report)
        run: >-
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet
          --scanners vuln,secret,misconfig --severity MEDIUM,HIGH,CRITICAL
          --format sarif --output /src/trivy.sarif /src

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Fail on high or critical findings
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --quiet
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src
