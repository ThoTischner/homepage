name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Yearly rebuild so the copyright year stays current
    - cron: '0 5 1 1 *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same build as locally: via the Dockerfile, output in ./dist.
      # Imprint contact data comes from repository secrets (masked in logs), not from the repository.
      - name: Build
        env:
          CONTACT_STREET: ${{ secrets.CONTACT_STREET }}
          CONTACT_CITY: ${{ secrets.CONTACT_CITY }}
          CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
          CONTACT_PHONE_E164: ${{ secrets.CONTACT_PHONE_E164 }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          CONTACT_VAT_ID: ${{ secrets.CONTACT_VAT_ID }}
        run: >-
          docker buildx build --target export --output type=local,dest=dist
          --build-arg CONTACT_STREET --build-arg CONTACT_CITY
          --build-arg CONTACT_PHONE --build-arg CONTACT_PHONE_E164
          --build-arg CONTACT_EMAIL --build-arg CONTACT_VAT_ID .

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
