services:
  # Dev server with live reload: docker compose up
  dev:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Polling so file changes are also detected on network and VM bind mounts
      ASTRO_POLLING: "true"

  # Production build preview: docker compose --profile preview up --build preview
  preview:
    build:
      context: .
      target: preview
      args:
        - CONTACT_STREET
        - CONTACT_CITY
        - CONTACT_PHONE
        - CONTACT_PHONE_E164
        - CONTACT_EMAIL
        - CONTACT_VAT_ID
    ports:
      - "127.0.0.1:8080:80"
    profiles: ["preview"]

volumes:
  node_modules:
