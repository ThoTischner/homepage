services:
  # Dev server with live reload: docker compose up
  dev:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Polling so file changes are detected on bind mounts (e.g. WSL)
      ASTRO_POLLING: "true"

  # Production build preview: docker compose --profile preview up --build preview
  preview:
    build:
      context: .
      target: preview
    ports:
      - "127.0.0.1:8080:80"
    profiles: ["preview"]

volumes:
  node_modules:
